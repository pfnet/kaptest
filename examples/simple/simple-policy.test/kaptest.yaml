policies:
- ../simple-policy.yaml
resources:
- resources.yaml
vapTestSuites:
- policy: simple-policy
  tests:
  - object:
      kind: Deployment
      name: good-deployment
    expect: admit
  - object:
      kind: Deployment
      name: bad-deployment
    expect: deny
    deniedMessage: "replicas must be equal or less than 5, but got 6"
- policy: error-policy
  tests:
  - object:
      kind: Deployment
      name: good-deployment
    expect: error
mapTestSuites:
- policy: simple-policy
  tests:
  - object: 
      kind: Deployment
      name: good-deployment
    expect: mutate
    expectObject:
      kind: Deployment
      name: more-replicas-deployment
  - object: 
      kind: Deployment
      name: many-replicas-deployment
    expect: skip