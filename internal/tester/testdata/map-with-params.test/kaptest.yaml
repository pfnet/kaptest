policies:
- ../map-with-params.yaml
resources:
- resources.yaml
mapTestSuites:
- policy: deployment-replicas
  tests:
  - object:
      kind: Deployment
      name: small
      namespace: foo
    param:
      namespace: hoge
      name: config1
    expect: mutate
    expectObject:
      kind: Deployment
      name: ok
      namespace: foo
  - object:
      kind: Deployment
      name: ok
      namespace: foo
    param:
      namespace: hoge
      name: config1
    expect: skip
- policy: deployment-replicas
  binding: deployment-replicas-binding
  tests:
  - object:
      kind: Deployment
      name: small
      namespace: foo
    param:
      namespace: foo
      name: config1
    expect: mutate
    expectObject:
      kind: Deployment
      name: ok-large
      namespace: foo