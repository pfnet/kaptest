version: v1alpha1
policies:
- ../vap-with-userinfo.yaml
resources:
- resources.yaml
vapTestSuites:
- policy: deployment-replicas
  tests:
  - object:
      kind: Deployment
      name: ok
    userInfo:
      name: admin@example.com
    expect: admit
  - object:
      kind: Deployment
      name: ok
    userInfo:
      name: 'system:serviceaccount:foo:default'
    expect: deny
    deniedMessage: "system:serviceaccount:foo:default is not allowed to create or update deployments"
