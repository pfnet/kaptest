apiVersion: apps/v1
kind: Deployment
metadata:
  name: ok
  namespace: foo
  labels:
    app: ok-deployment
spec:
  replicas: 5
  selector:
    matchLabels:
      app: ok-deployment
  template:
    metadata:
      labels:
        app: ok-deployment
    spec:
      containers:
      - name: nginx
        image: nginx
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: small
  namespace: foo
  labels:
    app: ok-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ok-deployment
  template:
    metadata:
      labels:
        app: ok-deployment
    spec:
      containers:
      - name: nginx
        image: nginx
---
apiVersion: example.com/v1
kind: MyCustomResource
metadata:
  name: my-config
  namespace: hoge
spec:
  maxReplicas: 5