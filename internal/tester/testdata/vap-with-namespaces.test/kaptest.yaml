version: v1alpha1
policies:
- ../vap-with-namespaces.yaml
resources:
- resources.yaml
vapTestSuites:
- policy: deployment-replicas
  tests:
  - object:
      kind: Deployment
      name: ok
      namespace: foo
    expect: admit
  - object:
      kind: Deployment
      name: bad
      namespace: foo
    expect: deny
    deniedMessage: "replicas must be equal or less than 5"
