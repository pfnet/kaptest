apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  namespace: default
  name: base
spec:
  virtualhost:
    fqdn: foo-basic.bar.com
  routes:
    - conditions:
      - prefix: /
      services:
        - name: s1
          port: 80
---
apiVersion: projectcontour.io/v1
kind: HTTPProxy
metadata:
  namespace: default
  name: updated
spec:
  virtualhost:
    fqdn: mutated.foo-basic.bar.com
  routes:
    - conditions:
      - prefix: /
      services:
        - name: s1
          port: 8080
